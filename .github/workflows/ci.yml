name: CI

on:
  pull_request:
    branches: [main]
  # Also on main, so the README badge shows the state of the main branch.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One group per PR (new pushes cancel the older run). Pushes to main get a
  # group per commit and are never cancelled, so every merge is fully checked.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  e2e:
    name: E2E (Playwright + Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Local Supabase in Docker; applies supabase/migrations on start. Only the
      # services the app uses (Postgres, Auth, PostgREST, Kong) are started.
      # Keys come from `supabase status` inside playwright.config.ts: no secrets.
      - name: Start Supabase (local)
        run: >-
          npx --yes supabase@3.0.0 start
          -x studio,storage-api,imgproxy,realtime,edge-runtime,logflare,vector,mailpit,supavisor,postgres-meta

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      # Playwright builds and starts the app against the local Supabase.
      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Stop Supabase
        if: always()
        run: npx --yes supabase@3.0.0 stop --no-backup
